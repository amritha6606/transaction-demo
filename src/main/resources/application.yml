spring:
    datasource:
        url: jdbc:postgresql://localhost:5432/transaction-demo
        username: postgres
        password: admin
    jpa:
        hibernate: 
            ddl-auto: update
        show-sql: true
        properties: 
            hibernate:
                formal_sql: true
                dialect: org.hibernate.dialect.PostgreSQLDialect
    application:
        name: transaction-demo

logging:
    level:
        org.springframework.transaction: DEBUG
        org.hibernate.transaction: DEBUG
        org.springframework.orm.jpa.JpaTransactionManager: DEBUG